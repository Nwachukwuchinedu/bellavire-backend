<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Chat</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
        }

        /* Login Screen */
        #loginScreen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        /* Chat Screen */
        #chatScreen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            margin: 0;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .chat-sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
        }

        .new-chat-btn {
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .new-chat-btn:hover {
            background: #5a6fd8;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            padding: 15px;
            margin-bottom: 5px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-item:hover {
            background: #e9ecef;
        }

        .chat-item.active {
            background: #667eea;
            color: white;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .chat-item-content {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .chat-last-message {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: #4CAF50;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            min-width: 20px;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-items: flex-end;
        }

        .message.received {
            align-items: flex-start;
        }

        .message-bubble {
            padding: 10px 15px;
            margin: 5px 0;
            position: relative;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border-radius: 18px 18px 18px 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .message-status {
            display: inline-flex;
            align-items: center;
            margin-left: 5px;
            font-size: 12px;
        }

        .message-status .unread-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
        }

        .message-status .tick {
            color: #4CAF50;
            font-size: 14px;
            margin-left: 2px;
        }

        .message-status .tick.single {
            opacity: 0.7;
        }

        .message-status .tick.double {
            opacity: 1;
        }

        .typing-indicator {
            padding: 10px 15px;
            background: #e9ecef;
            border-radius: 18px;
            color: #666;
            font-style: italic;
            margin: 10px 0;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
        }

        .search-result-item {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-result-item:hover {
            background: #f0f0f0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                height: 95vh;
            }

            .chat-sidebar {
                width: 250px;
            }

            .chat-item {
                padding: 10px;
            }

            .chat-avatar {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-form">
            <h2>Welcome to Real Estate Chat</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="container">
        <div class="chat-header">
            <h2>Real Estate Chat</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="chat-content">
            <div class="chat-sidebar">
                <button class="new-chat-btn" onclick="showNewChatModal()">+ New Chat</button>
                <div class="chat-list" id="chatList">
                    <!-- Chat items will be loaded here -->
                </div>
            </div>

            <div class="chat-main">
                <div class="chat-messages" id="messagesContainer">
                    <div style="text-align: center; color: #666; margin-top: 50px;">
                        Select a chat to start messaging
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="chat-input">
                        <textarea id="messageInput" class="message-input" placeholder="Type your message..." rows="1"
                            onkeypress="handleKeyPress(event)"></textarea>
                        <button class="send-btn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Modal -->
    <div id="newChatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Start New Chat</h3>
                <span class="close" onclick="closeNewChatModal()">&times;</span>
            </div>
            <div class="form-group">
                <label for="searchQuery">Search for a user:</label>
                <input type="text" id="searchQuery" placeholder="Enter name or email">
            </div>
            <div class="form-group">
                <label for="searchRole">User Type:</label>
                <select id="searchRole">
                    <option value="landlord">Landlord</option>
                    <option value="tenant">Tenant</option>
                </select>
            </div>
            <button class="login-btn" onclick="searchUsers()">Search</button>
            <div class="search-results" id="searchResults">
                <!-- Search results will appear here -->
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentChat = null;
        let allChats = [];
        let socket = null;
        let userType = null;
        let typingTimeout = null;

        // Login function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/auth/login/local', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (data.success) {
                    const token = data.data.accessToken;
                    const user = data.data.user;

                    localStorage.setItem('token', token);
                    localStorage.setItem('userType', user.role);

                    currentUser = { token: token };
                    userType = user.role;

                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatScreen').style.display = 'flex';

                    initializeSocket();
                    loadChats();
                } else {
                    alert('Login failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed. Please try again.');
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userType');
            currentUser = null;
            currentChat = null;
            allChats = [];

            if (socket) {
                socket.disconnect();
                socket = null;
            }

            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('chatScreen').style.display = 'none';

            // Clear inputs
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // Initialize Socket.IO connection
        function initializeSocket() {
            console.log('🔌 Initializing Socket.IO connection...');

            socket = io('http://localhost:5000', {
                withCredentials: true,
                transports: ['polling', 'websocket'],
                timeout: 20000,
                forceNew: true,
                upgrade: true,
                rememberUpgrade: false
            });

            socket.on('connect', () => {
                console.log('✅ Socket.IO connected');

                // Decode JWT to get userId
                const token = localStorage.getItem('token');
                if (token) {
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        const userId = payload.userId;
                        console.log('👤 User ID from token:', userId);

                        socket.emit('join-user', { userId: userId });
                    } catch (error) {
                        console.error('❌ Failed to decode JWT:', error);
                    }
                }
            });

            socket.on('disconnect', () => {
                console.log('🔌 Socket.IO disconnected');
            });

            socket.on('connect_error', (error) => {
                console.error('🔌 Socket.IO connection error:', error);
                console.log('🔌 Error details:', error);

                // Retry connection after 5 seconds
                setTimeout(() => {
                    console.log('🔄 Retrying Socket.IO connection...');
                    if (socket) {
                        socket.connect();
                    }
                }, 5000);

                // Fallback to polling only if websocket fails
                if (error.message === 'websocket error') {
                    console.log('🔄 Falling back to polling transport...');
                    socket.io.opts.transports = ['polling'];
                }
            });

            socket.on('error', (error) => {
                console.error('🔌 Socket.IO error:', error);
            });

            socket.on('reconnect', () => {
                console.log('✅ Socket.IO reconnected');

                // Re-join user room
                const token = localStorage.getItem('token');
                if (token) {
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        const userId = payload.userId;
                        socket.emit('join-user', { userId: userId });
                    } catch (error) {
                        console.error('❌ Failed to decode JWT on reconnect:', error);
                    }
                }
            });

            socket.on('reconnect_error', (error) => {
                console.error('🔌 Socket.IO reconnect error:', error);
            });

            // Handle incoming messages
            socket.on('message-received', (data) => {
                console.log('📨 Message received:', data);
                handleIncomingMessage(data);
            });

            // Handle typing indicators
            socket.on('user-typing', (data) => {
                console.log('⌨️ User typing:', data);
                handleTypingIndicator(data);
            });

            // Handle message read status updates
            socket.on('messages-read', (data) => {
                console.log('📖 Messages read by other user:', data);
                handleMessagesRead(data);
            });
        }

        // Handle incoming messages
        function handleIncomingMessage(data) {
            const { chatId, message } = data;
            console.log('📨 Handling incoming message:', data);

            // Add message to current chat if it's open
            if (currentChat === chatId) {
                const messagesContainer = document.getElementById('messagesContainer');
                const messageElement = createMessageElement(message, message.senderType);
                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // Mark messages as read if they're from the other party
                if (message.senderType !== userType) {
                    markMessagesAsRead(chatId);
                }
            }

            // Update chat list immediately
            loadChats();
        }

        // Handle typing indicators
        function handleTypingIndicator(data) {
            const { chatId, isTyping, senderType } = data;
            console.log('⌨️ Typing indicator:', data);

            if (currentChat === chatId) {
                const typingIndicator = document.getElementById('typingIndicator');
                if (isTyping) {
                    if (!typingIndicator) {
                        const indicator = document.createElement('div');
                        indicator.id = 'typingIndicator';
                        indicator.className = 'typing-indicator';
                        indicator.textContent = `${senderType === 'tenant' ? 'Tenant' : 'Landlord'} is typing...`;
                        document.getElementById('messagesContainer').appendChild(indicator);
                        document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
                    }
                } else {
                    if (typingIndicator) {
                        typingIndicator.remove();
                    }
                }
            }
        }

        // Handle messages read by other user
        function handleMessagesRead(data) {
            const { chatId } = data;

            if (currentChat === chatId) {
                // Update sent messages to show double ticks
                const sentMessages = document.querySelectorAll('.message.sent .message-status .tick.single');
                sentMessages.forEach(tick => {
                    tick.innerHTML = '✓✓';
                    tick.className = 'tick double';
                });
            }

            // Update chat list to reflect read status
            updateChatList();
        }

        // Load all chats for the user
        async function loadChats() {
            const token = localStorage.getItem('token');
            if (!token) return;

            console.log('🔄 Loading chats for userType:', userType);

            try {
                const response = await fetch(`http://localhost:5000/api/${userType}s/chat/user`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('📋 Loaded chats:', data);

                if (data.success) {
                    allChats = data.data.chats;
                    displayChats();
                }
            } catch (error) {
                console.error('❌ Failed to load chats:', error);
            }
        }

        // Display chats in the sidebar
        function displayChats() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            console.log('📋 Displaying', allChats.length, 'chats');

            allChats.forEach(chat => {
                const otherParty = userType === 'tenant' ? chat.landlordId : chat.tenantId;
                const otherPartyName = `${otherParty.firstName} ${otherParty.lastName}`;

                // Calculate unread count
                let unreadCount = 0;
                chat.messages.forEach(message => {
                    if (message.senderType !== userType && !message.isRead) {
                        unreadCount++;
                    }
                });

                console.log(`📋 Chat with ${otherPartyName}: ${unreadCount} unread messages`);

                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item';
                chatItem.onclick = () => selectChat(chat._id);

                chatItem.innerHTML = `
                    <div class="chat-avatar">${otherPartyName.charAt(0).toUpperCase()}</div>
                    <div class="chat-item-content">
                        <div class="chat-name">${otherPartyName}</div>
                        <div class="chat-last-message">
                            ${chat.messages.length > 0 ? chat.messages[chat.messages.length - 1].content : 'No messages yet'}
                        </div>
                    </div>
                    ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                `;

                chatList.appendChild(chatItem);
            });
        }

        // Select a chat
        async function selectChat(chatId) {
            currentChat = chatId;

            // Update active chat in sidebar
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });

            const chatItem = document.querySelector(`[onclick="selectChat('${chatId}')"]`);
            if (chatItem) {
                chatItem.classList.add('active');
            }

            // Mark messages as read when opening chat
            markMessagesAsRead(chatId);

            // Load chat history
            await loadChatHistory(chatId);
        }

        // Load chat history
        async function loadChatHistory(chatId) {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`http://localhost:5000/api/${userType}s/chat/history/${chatId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('Chat history:', data);

                if (data.success) {
                    displayMessages(data.data.chat.messages);
                }
            } catch (error) {
                console.error('Failed to load chat history:', error);
            }
        }

        // Display messages
        function displayMessages(messages) {
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.innerHTML = '';

            messages.forEach(message => {
                const messageElement = createMessageElement(message, message.senderType);
                messagesContainer.appendChild(messageElement);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Create message element
        function createMessageElement(message, senderType) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${senderType === userType ? 'sent' : 'received'}`;

            const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Create status indicator
            let statusIndicator = '';
            if (senderType === userType) {
                // Sent message - show tick(s)
                if (message.isRead) {
                    statusIndicator = '<span class="tick double">✓✓</span>';
                } else {
                    statusIndicator = '<span class="tick single">✓</span>';
                }
            } else {
                // Received message - show unread dot if not read
                if (!message.isRead) {
                    statusIndicator = '<span class="unread-dot"></span>';
                }
            }

            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${message.content}
                </div>
                <div class="message-time">
                    ${time}
                    <span class="message-status">
                        ${statusIndicator}
                    </span>
                </div>
            `;

            return messageDiv;
        }

        // Send message
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();

            if (!content || !currentChat) return;

            // Clear input
            messageInput.value = '';

            // Stop typing indicator
            sendTypingIndicator(false);

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                // Find the other party from current chat
                const chat = allChats.find(c => c._id === currentChat);
                if (!chat) return;

                const otherParty = userType === 'tenant' ? chat.landlordId : chat.tenantId;

                const response = await fetch(`http://localhost:5000/api/${userType}s/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipientId: otherParty._id,
                        recipientType: userType === 'tenant' ? 'landlord' : 'tenant',
                        content: content
                    }),
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('Send message response:', data);

                if (data.success) {
                    // Add message to UI immediately
                    const messageElement = createMessageElement(data.data.message, userType);
                    document.getElementById('messagesContainer').appendChild(messageElement);
                    document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;

                    // Update chat list
                    updateChatList();
                }
            } catch (error) {
                console.error('Failed to send message:', error);
                alert('Failed to send message. Please try again.');
            }
        }

        // Update chat list with new messages
        function updateChatList() {
            // Force reload chats to get updated read status
            loadChats();
        }

        // Mark messages as read
        function markMessagesAsRead(chatId) {
            const token = localStorage.getItem('token');
            if (!token) return;

            console.log('📖 Marking messages as read for chat:', chatId);

            fetch(`http://localhost:5000/api/${userType}s/chat/${chatId}/mark-read`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                credentials: 'include'
            }).then(response => {
                if (response.ok) {
                    console.log('✅ Messages marked as read successfully');
                    // Update the current chat's messages to show as read
                    updateMessageReadStatus(chatId);
                    // Force refresh chat list to update unread badges
                    setTimeout(() => {
                        loadChats();
                    }, 100);
                } else {
                    console.error('❌ Failed to mark messages as read:', response.status);
                }
            }).catch(error => {
                console.error('❌ Error marking messages as read:', error);
            });
        }

        // Update message read status in the UI
        function updateMessageReadStatus(chatId) {
            if (currentChat === chatId) {
                console.log('🔄 Updating message read status for chat:', chatId);

                // Update all received messages to show as read
                const receivedMessages = document.querySelectorAll('.message.received .message-status .unread-dot');
                console.log('📖 Found', receivedMessages.length, 'unread dots to remove');
                receivedMessages.forEach(dot => {
                    dot.remove();
                });

                // Update sent messages to show double ticks
                const sentMessages = document.querySelectorAll('.message.sent .message-status .tick.single');
                console.log('✓ Found', sentMessages.length, 'single ticks to update');
                sentMessages.forEach(tick => {
                    tick.innerHTML = '✓✓';
                    tick.className = 'tick double';
                });
            }
        }

        // Send typing indicator
        function sendTypingIndicator(isTyping) {
            if (socket && currentChat) {
                const recipientId = getOtherPartyId();
                if (recipientId) {
                    console.log('⌨️ Sending typing indicator:', { isTyping, recipientId });
                    socket.emit('typing', {
                        chatId: currentChat,
                        recipientId: recipientId,
                        isTyping: isTyping,
                        senderType: userType
                    });
                }
            }
        }

        // Get the other party's user ID for socket events
        function getOtherPartyId() {
            if (!currentChat || !allChats.length) return null;

            const chat = allChats.find(c => c._id === currentChat);
            if (!chat) return null;

            // Get the other party's user ID from the chat
            if (userType === 'tenant') {
                return chat.landlordId?.user || chat.landlordId?._id;
            } else {
                return chat.tenantId?.user || chat.tenantId?._id;
            }
        }

        // Handle key press in message input
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
                return;
            }

            // Send typing indicator with debouncing
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }

            sendTypingIndicator(true);

            typingTimeout = setTimeout(() => {
                sendTypingIndicator(false);
            }, 1500);
        }

        // Show new chat modal
        function showNewChatModal() {
            document.getElementById('newChatModal').style.display = 'block';
        }

        // Close new chat modal
        function closeNewChatModal() {
            document.getElementById('newChatModal').style.display = 'none';
            document.getElementById('searchResults').innerHTML = '';
        }

        // Search users
        async function searchUsers() {
            const query = document.getElementById('searchQuery').value;
            const role = document.getElementById('searchRole').value;

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`http://localhost:5000/api/chat/search-users?q=${encodeURIComponent(query)}&role=${role}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('Search results:', data);

                if (data.success) {
                    displaySearchResults(data.data);
                }
            } catch (error) {
                console.error('Failed to search users:', error);
            }
        }

        // Display search results
        function displaySearchResults(users) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (users.length === 0) {
                resultsContainer.innerHTML = '<p>No users found</p>';
                return;
            }

            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'search-result-item';
                userItem.innerHTML = `
                    <strong>${user.firstName} ${user.lastName}</strong><br>
                    <small>${user.email}</small>
                `;
                userItem.onclick = () => startNewChat(user);
                resultsContainer.appendChild(userItem);
            });
        }

        // Start new chat
        async function startNewChat(user) {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`http://localhost:5000/api/${userType}s/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipientId: user._id,
                        recipientType: user.role,
                        content: 'Hello! I would like to start a conversation.'
                    }),
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('New chat response:', data);

                if (data.success) {
                    closeNewChatModal();
                    loadChats();

                    // Select the new chat
                    if (data.data.chatId) {
                        selectChat(data.data.chatId);
                    }
                }
            } catch (error) {
                console.error('Failed to start new chat:', error);
            }
        }

        // Check if user is already logged in
        window.onload = function () {
            const token = localStorage.getItem('token');
            const storedUserType = localStorage.getItem('userType');

            if (token && storedUserType) {
                currentUser = { token: token };
                userType = storedUserType;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
                initializeSocket();
                loadChats();
            }
        };
    </script>
</body>

</html>
